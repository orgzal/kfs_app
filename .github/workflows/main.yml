name: Build Flutter IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Find IPA
        run: |
          echo "Searching for IPA files..."
          find . -name "*.ipa" -type f
          echo "Searching iOS build..."
          find build/ios -maxdepth 3 -type f 2>/dev/null || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
